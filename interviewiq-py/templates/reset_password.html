{% extends "_base.html" %}
{% block title %}Set new password — InterviewIQ{% endblock %}
{% block body %}
<div class="auth-screen">
  <div class="auth-card">
    <button onclick="history.back()" style="background:none;border:none;cursor:pointer;color:#6B7294;font-size:13px;display:flex;align-items:center;gap:5px;margin-bottom:16px;padding:0;">
      ← Back
    </button>
    <div class="auth-logo">
      <div class="sb-logo-icon">🎯</div>
      <div class="auth-logo-name">Interview<span class="sb-logo-sub">IQ</span></div>
    </div>
    <div class="auth-title">Enter new password</div>
    <div class="auth-sub">Enter the 6-digit code sent to <strong id="emailDisplay" style="color:#E2E4EF"></strong>, then choose a new password.</div>

    <div id="errorBox"></div>

    <form class="auth-form" id="resetForm">
      <div class="field">
        <label class="field-lbl">6-digit code</label>
        <input class="fi" inputmode="numeric" maxlength="6" id="code" placeholder="123456" required />
      </div>
      <div class="field">
        <label class="field-lbl">New password</label>
        <div style="position:relative">
          <input class="fi" type="password" id="newPassword" placeholder="At least 8 characters" required style="padding-right:42px" />
          <button type="button" id="toggleNew" style="position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#6B7294;font-size:16px;padding:0;line-height:1;">👁</button>
        </div>
      </div>
      <div class="field">
        <label class="field-lbl">Confirm new password</label>
        <div style="position:relative">
          <input class="fi" type="password" id="confirmPassword" placeholder="Re-enter your new password" required style="padding-right:42px" />
          <button type="button" id="toggleConfirm" style="position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#6B7294;font-size:16px;padding:0;line-height:1;">👁</button>
        </div>
      </div>
      <button class="btn btn-p btn-block" type="submit" id="submitBtn">Reset password</button>
    </form>

    <div class="auth-footer">
      <a href="/login" class="auth-link">← Back to log in</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  const params = new URLSearchParams(window.location.search);
  const email = params.get("email") || "";
  if (!email) window.location.href = "/forgot-password";
  document.getElementById("emailDisplay").textContent = email;

  // Password toggles
  function makeToggle(inputId, btnId) {
    const input = document.getElementById(inputId);
    const btn = document.getElementById(btnId);
    let visible = false;
    btn.addEventListener("click", () => {
      visible = !visible;
      input.type = visible ? "text" : "password";
      btn.textContent = visible ? "🙈" : "👁";
    });
  }
  makeToggle("newPassword", "toggleNew");
  makeToggle("confirmPassword", "toggleConfirm");

  document.getElementById("code").addEventListener("input", (e) => {
    e.target.value = e.target.value.replace(/\D/g, "");
  });

  const form = document.getElementById("resetForm");
  const errorBox = document.getElementById("errorBox");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.innerHTML = "";

    const code = document.getElementById("code").value;
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword.length < 8) {
      errorBox.innerHTML = `<div class="auth-error">Password must be at least 8 characters.</div>`;
      return;
    }
    if (newPassword !== confirmPassword) {
      errorBox.innerHTML = `<div class="auth-error">Passwords do not match.</div>`;
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>';

    try {
      await api.post("/auth/reset-password", { email, code, newPassword });
      showToast("Password reset successfully! Please log in.");
      setTimeout(() => window.location.href = "/login", 1500);
    } catch (err) {
      errorBox.innerHTML = `<div class="auth-error">${(err.data && err.data.message) || "Something went wrong. Please try again."}</div>`;
      submitBtn.disabled = false;
      submitBtn.textContent = "Reset password";
    }
  });
</script>
{% endblock %}
