{% extends "_base.html" %}
{% block title %}Sign up — InterviewIQ{% endblock %}
{% block body %}
<div class="auth-screen">
  <div class="auth-card">
    <button onclick="history.back()" style="background:none;border:none;cursor:pointer;color:#6B7294;font-size:13px;display:flex;align-items:center;gap:5px;margin-bottom:16px;padding:0;">
      ← Back
    </button>
    <div class="auth-logo">
      <div class="sb-logo-icon">🎯</div>
      <div class="auth-logo-name">Interview<span class="sb-logo-sub">IQ</span></div>
    </div>
    <div class="auth-title">Create your account</div>
    <div class="auth-sub">Get a personalized AI interview coach in under a minute.</div>

    <div id="errorBox"></div>

    <form class="auth-form" id="registerForm">
      <div class="field">
        <label class="field-lbl">Full name</label>
        <input class="fi" id="name" placeholder="Your full name" required />
      </div>
      <div class="field">
        <label class="field-lbl">Gmail address</label>
        <input class="fi" type="email" id="email" placeholder="you@gmail.com" required />
      </div>
      <div class="field">
        <label class="field-lbl">Password</label>
        <div style="position:relative">
          <input class="fi" type="password" id="password" placeholder="At least 8 characters" required style="padding-right:42px" />
          <button type="button" id="togglePw" style="position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#6B7294;font-size:16px;padding:0;line-height:1;">👁</button>
        </div>
        <div class="pw-strength" id="pwStrengthBar" style="display:none;margin-top:6px">
          <div class="pw-strength-fill" id="pwStrengthFill"></div>
        </div>
        <div class="pw-hint" id="pwStrengthLabel"></div>
      </div>
      <div class="field">
        <label class="field-lbl">Confirm Password</label>
        <div style="position:relative">
          <input class="fi" type="password" id="confirmPassword" placeholder="Re-enter your password" required style="padding-right:42px" />
          <button type="button" id="toggleConfirm" style="position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#6B7294;font-size:16px;padding:0;line-height:1;">👁</button>
        </div>
      </div>
      <button class="btn btn-p btn-block" type="submit" id="submitBtn">Create account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login" class="auth-link">Log in</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  Auth.redirectIfLoggedIn();

  // Password toggle
  function makeToggle(inputId, btnId) {
    const input = document.getElementById(inputId);
    const btn = document.getElementById(btnId);
    let visible = false;
    btn.addEventListener("click", () => {
      visible = !visible;
      input.type = visible ? "text" : "password";
      btn.textContent = visible ? "🙈" : "👁";
    });
  }
  makeToggle("password", "togglePw");
  makeToggle("confirmPassword", "toggleConfirm");

  // Strength meter
  const passwordInp = document.getElementById("password");
  const strengthBar = document.getElementById("pwStrengthBar");
  const strengthFill = document.getElementById("pwStrengthFill");
  const strengthLabel = document.getElementById("pwStrengthLabel");

  passwordInp.addEventListener("input", () => {
    const p = passwordInp.value;
    if (!p) { strengthBar.style.display = "none"; strengthLabel.textContent = ""; return; }
    let score = 0;
    if (p.length >= 8) score++;
    if (/[A-Z]/.test(p)) score++;
    if (/[0-9]/.test(p)) score++;
    if (/[^A-Za-z0-9]/.test(p)) score++;
    const colors = ["#F87171","#F87171","#FBBF24","#34D399","#34D399"];
    const labels = ["Too short","Weak","Okay","Good","Strong"];
    strengthBar.style.display = "block";
    strengthFill.style.width = `${score * 25}%`;
    strengthFill.style.background = colors[score];
    strengthLabel.textContent = labels[score];
    strengthLabel.style.color = colors[score];
  });

  const form = document.getElementById("registerForm");
  const errorBox = document.getElementById("errorBox");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.innerHTML = "";

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = passwordInp.value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password.length < 8) {
      errorBox.innerHTML = `<div class="auth-error">Password must be at least 8 characters.</div>`;
      return;
    }
    if (password !== confirmPassword) {
      errorBox.innerHTML = `<div class="auth-error">Passwords do not match.</div>`;
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>';

    try {
      const res = await api.post("/auth/register", { name, email, password });
      window.location.href = `/verify-otp?email=${encodeURIComponent(res.email)}`;
    } catch (err) {
      errorBox.innerHTML = `<div class="auth-error">${(err.data && err.data.message) || "Something went wrong. Please try again."}</div>`;
      submitBtn.disabled = false;
      submitBtn.textContent = "Create account";
    }
  });
</script>
{% endblock %}
